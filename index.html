<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dow Jones Live</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --text:#e8eaed; --muted:#8b949e; --up:#2ecc71; --down:#ff5c5c; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f7; --card:#fff; --text:#16191d; --muted:#667085; --up:#0a9d4a; --down:#d92d2d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:24px 16px; }
  .wrap { max-width:820px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:24px; }
  h1 { font-size:16px; font-weight:600; color:var(--muted); margin:0 0 8px; }
  .price { font-size:56px; font-weight:700; font-variant-numeric:tabular-nums; }
  .change { font-size:20px; font-variant-numeric:tabular-nums; margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .stats { display:flex; gap:32px; flex-wrap:wrap; margin-top:20px; color:var(--muted); font-size:14px; }
  .stats b { display:block; color:var(--text); font-size:16px; font-variant-numeric:tabular-nums; }
  canvas { width:100%; height:260px; margin-top:24px; display:block; }
  table { width:100%; border-collapse:collapse; margin-top:28px; font-size:14px; font-variant-numeric:tabular-nums; }
  th { text-align:right; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--muted); }
  td { text-align:right; padding:7px 8px; border-bottom:1px solid rgba(128,128,128,.2); }
  th:first-child, td:first-child { text-align:left; }
  td small { color:var(--muted); margin-left:6px; }
  .status { margin-top:12px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Dow Jones Industrial Average (^DJI)</h1>
  <div class="price" id="price">--</div>
  <div class="change" id="change">&nbsp;</div>
  <div class="stats">
    <div>Prev close<b id="prev">--</b></div>
    <div>Day high<b id="high">--</b></div>
    <div>Day low<b id="low">--</b></div>
  </div>
  <canvas id="chart"></canvas>
  <table>
    <thead><tr><th>Company</th><th>Price</th><th>Change</th><th>%</th></tr></thead>
    <tbody id="stocks"></tbody>
  </table>
  <div class="status" id="status">Loading…</div>
</div></div>
<script>
const $ = id => document.getElementById(id);
const fmt = n => n == null ? '--' : n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
let lastPrice = null;

function draw(series, prev) {
  const c = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  if (series.length < 2) return;
  const vals = series.map(p => p.c);
  const min = Math.min(...vals, prev), max = Math.max(...vals, prev);
  const pad = (max - min) * 0.1 || 1;
  const y = v => h - ((v - (min - pad)) / (max - min + 2 * pad)) * h;
  const x = i => (i / (series.length - 1)) * w;
  const style = getComputedStyle(document.documentElement);
  const up = vals[vals.length - 1] >= prev;
  const color = style.getPropertyValue(up ? '--up' : '--down');
  g.strokeStyle = style.getPropertyValue('--muted'); g.globalAlpha = 0.5;
  g.setLineDash([4, 4]); g.beginPath(); g.moveTo(0, y(prev)); g.lineTo(w, y(prev)); g.stroke();
  g.setLineDash([]); g.globalAlpha = 1;
  g.strokeStyle = color; g.lineWidth = 2; g.beginPath();
  vals.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v)));
  g.stroke();
}

async function update() {
  try {
    const r = await fetch('/api/quote');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const up = d.change >= 0, sign = up ? '+' : '';
    $('price').textContent = fmt(d.price);
    $('price').className = 'price ' + (lastPrice == null || d.price === lastPrice ? '' : d.price > lastPrice ? 'up' : 'down');
    lastPrice = d.price;
    $('change').textContent = `${sign}${fmt(d.change)} (${sign}${d.changePct.toFixed(2)}%)`;
    $('change').className = 'change ' + (up ? 'up' : 'down');
    $('prev').textContent = fmt(d.prevClose);
    $('high').textContent = fmt(d.dayHigh);
    $('low').textContent = fmt(d.dayLow);
    draw(d.series, d.prevClose);
    $('status').textContent = 'Market time ' + new Date(d.marketTime * 1000).toLocaleTimeString() + ' · refreshes every 1s';
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  }
}
async function updateStocks() {
  try {
    const list = await (await fetch('/api/stocks')).json();
    $('stocks').innerHTML = list.map(s => {
      if (s.price == null) return `<tr><td>${s.symbol}<small>${s.name}</small></td><td colspan="3">--</td></tr>`;
      const cls = s.change >= 0 ? 'up' : 'down', sign = s.change >= 0 ? '+' : '';
      return `<tr><td>${s.symbol}<small>${s.name}</small></td><td>${fmt(s.price)}</td>` +
        `<td class="${cls}">${sign}${fmt(s.change)}</td><td class="${cls}">${sign}${s.changePct.toFixed(2)}%</td></tr>`;
    }).join('');
  } catch (e) {}
}
update();
updateStocks();
setInterval(update, 1000);
setInterval(updateStocks, 5000);
addEventListener('resize', update);
</script>
</body>
</html>
